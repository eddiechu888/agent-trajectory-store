[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trajectory-store"
version = "0.1.1"
description = "Archive coding-agent sessions as sanitized ATIF and Markdown trajectories"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Eddie Chu"}]
keywords = ["agents", "atif", "claude-code", "codex", "devin", "trajectories"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
agent-trajectory-store = "agent_trajectory_store.cli:main"
ats = "agent_trajectory_store.cli:main"

[project.urls]
Homepage = "https://github.com/eddiechu888/agent-trajectory-store"
Repository = "https://github.com/eddiechu888/agent-trajectory-store"
Issues = "https://github.com/eddiechu888/agent-trajectory-store/issues"

[tool.setuptools.packages.find]
where = ["src"]
